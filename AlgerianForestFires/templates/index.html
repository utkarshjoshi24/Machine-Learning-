<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algerian Forest Fire Predictor</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* animated floating embers */
        .ember {
            position: fixed;
            border-radius: 50%;
            background: rgba(255, 120, 50, .45);
            filter: blur(1.5px);
            animation: float 6s ease-in-out infinite;
            pointer-events: none;
        }
        .ember:nth-child(1) { width:6px; height:6px; left:10%; animation-delay:0s; animation-duration:7s; }
        .ember:nth-child(2) { width:4px; height:4px; left:25%; animation-delay:1s; animation-duration:5s; }
        .ember:nth-child(3) { width:8px; height:8px; left:55%; animation-delay:2s; animation-duration:8s; }
        .ember:nth-child(4) { width:5px; height:5px; left:75%; animation-delay:.5s; animation-duration:6s; }
        .ember:nth-child(5) { width:3px; height:3px; left:90%; animation-delay:3s; animation-duration:9s; }
        @keyframes float {
            0%   { transform: translateY(100vh) scale(1); opacity: 0; }
            10%  { opacity: 1; }
            90%  { opacity: 1; }
            100% { transform: translateY(-10vh) scale(.4); opacity: 0; }
        }

        .hero-card {
            background: rgba(255, 255, 255, .06);
            border: 1px solid rgba(255, 255, 255, .12);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: 1.25rem;
            padding: 3.5rem 3rem;
            text-align: center;
            max-width: 600px;
            animation: fadeUp .8s ease-out;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .hero-card .icon {
            font-size: 3.5rem;
            margin-bottom: .75rem;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50%      { transform: scale(1.12); }
        }

        .hero-card h1 {
            color: #fff;
            font-weight: 800;
            font-size: 2.25rem;
            margin-bottom: .5rem;
        }
        .hero-card p {
            color: rgba(255,255,255,.7);
            font-size: 1.05rem;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .btn-fire {
            background: linear-gradient(135deg, #f7971e, #ff512f);
            border: none;
            color: #fff;
            font-weight: 700;
            font-size: 1.1rem;
            padding: .85rem 2.8rem;
            border-radius: .75rem;
            transition: transform .2s, box-shadow .2s;
            text-decoration: none;
        }
        .btn-fire:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(255, 81, 47, .45);
            color: #fff;
        }
    </style>
</head>
<body>
    <!-- floating embers -->
    <div class="ember"></div>
    <div class="ember"></div>
    <div class="ember"></div>
    <div class="ember"></div>
    <div class="ember"></div>

    <div class="hero-card">
        <div class="icon">🔥</div>
        <h1>Algerian Forest Fire Predictor</h1>
        <p>Predict the <strong>Fire Weather Index (FWI)</strong> using meteorological data and the Canadian FWI system. Enter your observations and get instant predictions powered by Ridge Regression.</p>
        <a href="/predict" class="btn-fire">Start Predicting &rarr;</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
